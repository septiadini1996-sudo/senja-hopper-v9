<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ARCHIPEL AIR — Archipelago Air Mail</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1626;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; color: #fdf3df;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; overflow: hidden; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; padding: 20px 16px 28px; box-sizing: border-box; overflow-y: auto; }
  .screen.on { display: flex; }
  /* One content column for every menu (v15.3 layout pass): panels,
     cards and the mode select all share the same width and margins,
     and panels size border-box — a card's padding used to ride ON
     TOP of its 94vw width and push its right edge off the screen. */
  .panel { box-sizing: border-box; background: linear-gradient(180deg, rgba(38, 22, 30, 0.88), rgba(24, 14, 22, 0.86)); border: 1px solid rgba(255, 190, 110, 0.35);
    border-radius: 14px; padding: 14px 16px; box-shadow: 0 10px 34px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255, 210, 140, 0.14); }
  /* Board tickets sit over the live 3D stage (v15 gate fix): at the
     menu panels' translucency the scene bled through and the ticket
     text lost its contrast, worst on the first card. Ticket panels go
     near-solid — the same gradient and depth, a denser body. */
  #scr-board .panel { background: linear-gradient(180deg, rgba(38, 22, 30, 0.97), rgba(24, 14, 22, 0.96)); }
  /* The mode select (v15): five cards in the menu's own language. */
  .modepanel { margin-top: 16px; width: min(640px, 94vw); box-sizing: border-box; }
  .modegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 9px; margin-top: 8px; }
  .modecard { background: linear-gradient(160deg, rgba(52, 36, 22, 0.55), rgba(10, 14, 18, 0.45));
    border: 1px solid rgba(242, 165, 65, 0.45); border-radius: 12px; padding: 10px;
    display: flex; flex-direction: column; gap: 6px; min-height: 118px; box-sizing: border-box; box-shadow: inset 0 1px 0 rgba(255, 210, 140, 0.12); }
  .modename { font-weight: 800; letter-spacing: 1.5px; color: #ffe9c4; font-size: 14px; }
  .modedesc { margin: 0; flex: 1; }
  .modebest { color: #ffc21f; font-weight: 700; font-size: 12px; letter-spacing: 0.5px; }
  .modecard .btn { margin: 2px 0 0; }
  /* The patrol's gunsight (v15): a reticle pinned to the chase view. */
  #sight { position: fixed; left: 50%; top: 46%; width: 92px; height: 92px; transform: translate(-50%, -50%);
    z-index: 6; pointer-events: none; }
  #sight .sc-ring { position: absolute; inset: 15px; border: 2px solid rgba(255, 110, 80, 0.85); border-radius: 50%;
    box-shadow: inset 0 0 12px rgba(255, 90, 60, 0.30), 0 0 8px rgba(0,0,0,0.35); }
  #sight .sc-dot { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    background: #ff5a3c; border-radius: 50%; }
  #sight .sc-t { position: absolute; background: rgba(255, 110, 80, 0.9); }
  #sight .sc-t.t { left: 50%; top: 0; width: 2px; height: 17px; margin-left: -1px; }
  #sight .sc-t.b { left: 50%; bottom: 0; width: 2px; height: 17px; margin-left: -1px; }
  #sight .sc-t.l { left: 0; top: 50%; width: 17px; height: 2px; margin-top: -1px; }
  #sight .sc-t.r { right: 0; top: 50%; width: 17px; height: 2px; margin-top: -1px; }
  /* The patrol's guide marker (v15.1): a hazard-orange diamond that
     rides the nearest drone's bearing — centred on it when it is in
     the frame, clamped to an edge with an arrow when it is not — over
     a range label in the guide chip's own dress. */
  #dmark { position: fixed; z-index: 6; pointer-events: none; transform: translate(-50%, -50%);
    display: none; flex-direction: column; align-items: center; gap: 3px; }
  #dmark .dm-dia { width: 15px; height: 15px; transform: rotate(45deg);
    background: rgba(255, 90, 50, 0.92); border: 2px solid #ffd9a8;
    box-shadow: 0 0 10px rgba(255, 90, 50, 0.85), 0 2px 6px rgba(0,0,0,0.5); }
  #dmark .dm-lab { background: rgba(20,12,20,0.85); border: 1px solid rgba(255,110,80,0.65);
    color: #ffe9c4; border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 800;
    letter-spacing: 1px; white-space: nowrap; }
  /* The lock bracket (v15.2): four corners riding the locked target,
     its name/range above and its hull bar below. Orange while the
     lock is still biting; red, with a glow, once it holds. The sight
     itself takes the same red dress while it sits on the lead point. */
  #lockbox { position: fixed; z-index: 6; pointer-events: none; width: 88px; height: 88px;
    transform: translate(-50%, -50%); display: none; }
  #lockbox .lk-c { position: absolute; width: 20px; height: 20px; border: 0 solid rgba(255, 170, 60, 0.95); }
  #lockbox .lk-c.tl { left: 0; top: 0; border-left-width: 3px; border-top-width: 3px; }
  #lockbox .lk-c.tr { right: 0; top: 0; border-right-width: 3px; border-top-width: 3px; }
  #lockbox .lk-c.bl { left: 0; bottom: 0; border-left-width: 3px; border-bottom-width: 3px; }
  #lockbox .lk-c.br { right: 0; bottom: 0; border-right-width: 3px; border-bottom-width: 3px; }
  #lockbox.locked .lk-c { border-color: #ff3524;
    filter: drop-shadow(0 0 5px rgba(255, 53, 36, 0.9)); }
  #lockbox .lk-lab { position: absolute; left: 50%; top: -24px; transform: translateX(-50%);
    background: rgba(20,12,20,0.85); border: 1px solid rgba(255,110,80,0.65); color: #ffe9c4;
    border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 800; letter-spacing: 1px;
    white-space: nowrap; }
  #lockbox .lk-hp { position: absolute; left: 8px; right: 8px; bottom: -13px; height: 6px;
    background: rgba(20,12,20,0.8); border: 1px solid rgba(255,220,160,0.5); border-radius: 3px; overflow: hidden; }
  #lockbox .lk-fill { display: block; height: 100%; background: #ff5030; transition: width 0.12s linear; }
  #sight.locked .sc-ring { border-color: #ff3524; box-shadow: inset 0 0 12px rgba(255, 53, 36, 0.4), 0 0 10px rgba(255, 53, 36, 0.55); }
  #sight.locked .sc-dot { background: #ff3524; }
  #sight.locked .sc-t { background: #ff3524; }
  /* The damage vignette (v15.2): a red edge over the whole frame,
     opacity driven by the last burst that landed. */
  #dmgvig { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(200,20,10,0) 52%, rgba(200,20,10,0.55) 100%); }
  /* The patrol's trigger (v15): a big hold-to-fire disc, low right. */
  #firebtn { position: fixed; right: 18px; bottom: 168px; z-index: 7; width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid rgba(255, 160, 120, 0.85); cursor: pointer; touch-action: none; pointer-events: auto;
    background: radial-gradient(circle at 35% 30%, rgba(255, 122, 82, 0.92), rgba(158, 42, 20, 0.94));
    color: #fff6e6; font: 800 15px/1 inherit; letter-spacing: 1.5px; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 2px 6px rgba(255, 220, 190, 0.35); }
  #firebtn.held { filter: brightness(1.4); }
  h1.logo { font-size: 52px; letter-spacing: 3px; margin: 12px 0 2px; color: #ffd98f;
    text-shadow: 0 3px 0 #a33d1c, 0 6px 22px rgba(0,0,0,0.6); font-weight: 800; text-align: center; }
  /* The title's button column (v15.3): one width, one rhythm — the
     primary action leads, the rest follow at a uniform measure. */
  .menucol { display: flex; flex-direction: column; align-items: center; gap: 2px; width: min(640px, 94vw); }
  .menucol .btn { width: min(330px, 88vw); box-sizing: border-box; }
  .sub { font-size: 16px; letter-spacing: 4px; color: #ffcf9e; margin: 0 0 14px; text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(90, 30, 10, 0.85), 0 0 14px rgba(90, 30, 10, 0.45); font-weight: 700; }
  h2.ptitle, h3.ptitle { font-size: 26px; letter-spacing: 2px; margin: 4px 0 12px; color: #ffd98f; text-align: center;
    text-shadow: 0 2px 16px rgba(74, 26, 0, 0.65), 0 1px 4px rgba(74, 26, 0, 0.75); }
  h2.ptitle::after, h3.ptitle::after { content: ''; display: block; width: 56px; height: 3px; margin: 7px auto 0;
    border-radius: 2px; background: linear-gradient(90deg, transparent, #f2a541, transparent); }
  h3.ptitle { font-size: 20px; }
  .btn { pointer-events: auto; cursor: pointer; border: 1px solid rgba(255, 200, 120, 0.55);
    background: linear-gradient(180deg, rgba(122, 52, 26, 0.92), rgba(84, 32, 20, 0.92));
    color: #ffe9c4; font: 700 16px/1.2 inherit; letter-spacing: 1.5px;
    padding: 12px 22px; margin: 5px; border-radius: 10px; min-width: 230px; text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255, 220, 160, 0.18);
    transition: filter 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease; }
  .btn:hover { filter: brightness(1.18); }
  .btn:active { transform: translateY(1px); }
  .btn.small { min-width: 0; padding: 9px 14px; font-size: 14px; }
  .btn.primary { background: linear-gradient(180deg, #d97b2f, #b44f1d); color: #fff6e6; }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .btn.on { outline: 2px solid #ffd98f; background: linear-gradient(180deg, #e89a3f, #c25e20); }
  .topchips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
  .chip { background: linear-gradient(180deg, rgba(38, 22, 30, 0.88), rgba(24, 14, 22, 0.85)); border: 1px solid rgba(255, 190, 110, 0.4);
    border-radius: 999px; padding: 6px 14px; font-size: 14px; letter-spacing: 1px; font-weight: 700; }
  .chip b { color: #ffd98f; }
  .objline { font-size: 15px; color: #ffe1ae; background: rgba(24,14,22,0.7); padding: 7px 16px;
    border-radius: 999px; margin-bottom: 12px; letter-spacing: 0.5px; }
  .card { width: min(640px, 94vw); margin: 8px 0; display: flow-root; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  #scr-map .card { width: min(700px, 94vw); }
  .card:hover { border-color: rgba(255, 200, 120, 0.6); }
  .card.sel { outline: 2px solid #f2a541; outline-offset: 1px; }
  /* Ticket furniture (v14): the mission badge, the gold pay pill, the

  .typebadge { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
    border-radius: 10px; background: rgba(242, 165, 65, 0.14); border: 1px solid rgba(255, 200, 120, 0.45); }
  .typebadge .typeicon { width: 22px; height: 22px; vertical-align: 0; }
  .paypill { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; color: #2a1608;
    background: linear-gradient(180deg, #ffd98f, #f2a541); border-radius: 999px; padding: 5px 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
  .objbox { background: rgba(242, 165, 65, 0.10); border: 1px solid rgba(255, 200, 120, 0.22);
    border-radius: 10px; padding: 8px 12px; color: #ffe1ae; }
  .stampchip { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; padding: 4px 10px; border-radius: 999px; }
  .stampchip.have { background: rgba(46, 110, 62, 0.85); color: #d9f5df; border: 1px solid rgba(140, 230, 160, 0.5); }
  .stampchip.next { background: rgba(180, 79, 29, 0.9); color: #ffe9c4; border: 1px solid rgba(255, 200, 120, 0.55); }
  .ticketfoot { margin-top: 10px; }
  .pvcard { padding: 10px; }
  .pvcard canvas { border-radius: 10px; border: 1px solid rgba(255, 200, 120, 0.35); background: #171019; }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; padding: 3px 9px; border-radius: 999px;
    background: #b44f1d; color: #ffe9c4; }
  .tag.side { background: #3d5a80; }
  .route { font-size: 20px; font-weight: 800; color: #ffd98f; }
  .meta { font-size: 13.5px; color: #f3d9b0; margin-top: 4px; line-height: 1.45; }
  .pips { letter-spacing: 3px; color: #ffd98f; font-size: 15px; }
  .segrow { display: flex; align-items: center; gap: 6px; }
  .seg { width: 34px; height: 20px; border-radius: 5px; border: 1px solid rgba(255,200,120,0.5);
    background: rgba(255,255,255,0.07); cursor: pointer; padding: 0; }
  .seg.fill { background: linear-gradient(180deg, #f2a541, #cf6a1e); }
  .seglabel { font-size: 13px; color: #f3d9b0; min-width: 34px; }
  .setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 9px 6px; border-bottom: 1px solid rgba(255,190,110,0.14); flex-wrap: wrap; border-radius: 6px; }
  .setrow:hover { background: rgba(255, 210, 140, 0.05); }
  .setrow:last-child { border-bottom: none; }
  .setname { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
  /* ---------- flight HUD ---------- */
  #hud { position: absolute; inset: 0; display: none; pointer-events: none; }
  #hud.on { display: block; }
  #hud .topbar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex;
    justify-content: space-between; align-items: flex-start; }
  #hud .col { display: flex; flex-direction: column; gap: 6px; }
  #hud .hchip { background: rgba(20, 12, 20, 0.87); border: 1px solid rgba(255,190,110,0.5);
    border-radius: 9px; padding: 6px 12px; font-size: 14px; font-weight: 800; letter-spacing: 1px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.65); }
  #hud .hchip b { color: #ffd98f; }
  #timer { font-size: 36px; font-weight: 800; color: #fff3da; background: rgba(20,12,20,0.78);

    text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  #pausebtn { pointer-events: auto; cursor: pointer; width: 52px; height: 52px; border-radius: 12px;
    border: 1px solid rgba(255,190,110,0.55); background: rgba(20,12,20,0.82); color: #ffd98f;
    font-size: 19px; font-weight: 900; }
  #gauges { position: absolute; left: 12px; top: 118px; background: rgba(20,12,20,0.82);

  #ribbon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 46px; height: 230px;
    background: rgba(20,12,20,0.72); border: 1px solid rgba(255,190,110,0.4); border-radius: 9px; }
  #ribbon .track { position: absolute; left: 50%; top: 8px; bottom: 8px; width: 4px; margin-left: -2px;
    background: rgba(255,220,160,0.35); border-radius: 2px; }
  #ribbon .marker { position: absolute; left: 50%; width: 22px; height: 10px; margin-left: -11px;

  #ribbon .tick { position: absolute; right: 30px; transform: translateY(50%); font-size: 10.5px;

  #radar { position: absolute; left: 12px; top: 282px; border-radius: 50%;

  #minimap { position: absolute; left: 12px; top: 406px; background: rgba(20,12,20,0.82);
    border: 1px solid rgba(255,190,110,0.4); border-radius: 12px; }
  #cambtn { pointer-events: auto; cursor: pointer; border: 1px solid rgba(255,190,110,0.55);

  #cloudveil { position: absolute; inset: 0; background: #fdf6ec; opacity: 0; pointer-events: none; }
  #rain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
  #guide { position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%);
    background: rgba(20,12,20,0.85); border: 1px solid rgba(255,190,110,0.55); color: #ffe9c4;
    border-radius: 999px; padding: 9px 20px; font-size: 17px; font-weight: 800; letter-spacing: 1px;
    white-space: nowrap; }
  /* The stunt callout (v15.3): gold on dark, centred high where the

  #stunt { position: absolute; left: 50%; top: 96px; transform: translateX(-50%);

  #lookchip { position: absolute; right: 14px; bottom: 118px;

  /* ---------- flight controls ---------- */
  .fctl { position: absolute; display: none; pointer-events: none; }

  /* ---------- v13: icons, chart, radio ---------- */
  .planeicon { width: 100%; max-width: 330px; display: block; margin: 2px auto 8px;
    border-radius: 10px; border: 1px solid rgba(255, 190, 110, 0.35);
